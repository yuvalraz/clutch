<script id="ops-logic">
// Pure page logic: no DOM and no capability access. Plain objects and arrays only
// (no Set or Map), so the page source holds no write-shaped call.
var OPS_MAX_PROJECTS = 40;
var OPS_MAX_INITIATIVES = 15;
var OPS_DAY_MS = 86400000;
var OPS_FLOOR_MS = 4 * 3600000;

function opsUnwrap(p) {
  if (typeof p === "string") {
    try { p = JSON.parse(p); } catch (e) { return null; }
  }
  if (p && typeof p === "object" && !Array.isArray(p) && "payload" in p && "content" in p) return opsUnwrap(p.payload);
  return p && typeof p === "object" ? p : null;
}

function opsList(p, key) {
  p = opsUnwrap(p);
  if (Array.isArray(p)) return p;
  return p && Array.isArray(p[key]) ? p[key] : null;
}

function opsStr(v) {
  return typeof v === "string" && v ? v : null;
}

function opsOwn(map, key) {
  return map && typeof map === "object" && Object.prototype.hasOwnProperty.call(map, key) ? map[key] : null;
}

function opsTime(v) {
  var t = typeof v === "number" ? v : typeof v === "string" ? Date.parse(v) : NaN;
  return isNaN(t) ? null : t;
}

// Member projects of one list_projects payload, completed and canceled dropped.
function opsMembers(projects) {
  return (projects || []).filter(function (p) {
    var type = p && p.status && p.status.type;
    return p && opsStr(p.id) && type !== "completed" && type !== "canceled";
  });
}

function opsIssue(i) {
  var status = i.status && typeof i.status === "object" ? i.status.name : i.status;
  return {id: i.id, title: opsStr(i.title), state: opsStr(status),
          open: i.statusType !== "completed" && i.statusType !== "canceled",
          url: opsStr(i.url), parent: opsStr(i.parentId)};
}

function opsLane(id, name, url) {
  return {lane: {id: id, name: name, url: url, issues: []}, seen: Object.create(null)};
}

function opsAddIssue(home, i) {
  if (!i || !opsStr(i.id) || home.seen[i.id]) return;
  home.seen[i.id] = true;
  home.lane.issues.push(opsIssue(i));
}

function opsZone(ref, raw) {
  var init = opsUnwrap(raw) || {};
  var first = Array.isArray(init.parentInitiatives) ? init.parentInitiatives[0] : null;
  var parent = first && typeof first === "object"
    ? {id: opsStr(first.id), name: opsStr(first.name), url: opsStr(first.url)} : null;
  return {id: ref.id, name: opsStr(init.name) || opsStr(ref.name), url: opsStr(init.url), parent: parent, projects: []};
}

function normalizeLinear(payloads) {
  payloads = payloads || {};
  var initiatives = [], noInitiative = [], outside = [];
  var zones = Object.create(null), homes = Object.create(null), away = Object.create(null), none = null;
  opsMembers(opsList(payloads.projects, "projects")).forEach(function (p) {
    var home = opsLane(p.id, opsStr(p.name), opsStr(p.url));
    (opsList(opsOwn(payloads.issuesByProject, p.id), "issues") || []).forEach(function (i) { opsAddIssue(home, i); });
    homes[p.id] = home;
    if (opsStr(p.uuid)) homes[p.uuid] = home;
    var ref = Array.isArray(p.initiatives) ? p.initiatives[0] : null;
    if (ref && opsStr(ref.id)) {
      if (!zones[ref.id]) {
        zones[ref.id] = opsZone(ref, opsOwn(payloads.initiativesById, ref.id));
        initiatives.push(zones[ref.id]);
      }
      zones[ref.id].projects.push(home.lane);
    } else {
      noInitiative.push(home.lane);
    }
  });
  (opsList(payloads.assigned, "issues") || []).forEach(function (i) {
    if (!i || !opsStr(i.id)) return;
    var pid = opsStr(i.projectId), home = pid ? homes[pid] : null;
    if (!home && pid) {
      if (!away[pid]) {
        var name = i.project && typeof i.project === "object" ? i.project.name : i.project;
        away[pid] = opsLane(pid, opsStr(name), null);
        outside.push(away[pid].lane);
      }
      home = away[pid];
    } else if (!home) {
      home = none = none || opsLane("none", "No project", null);
    }
    opsAddIssue(home, i);
  });
  if (none) noInitiative.push(none.lane);
  return {initiatives: initiatives, noInitiative: noInitiative, outside: outside};
}

function watchDiff(have, projectsPayload) {
  var projects = opsList(projectsPayload, "projects");
  if (!projects) return {drop: [], add: []};
  var members = opsMembers(projects);
  var started = members.filter(function (p) { return p.status && p.status.type === "started"; });
  var kept = started.concat(members.filter(function (p) { return started.indexOf(p) < 0; })).slice(0, OPS_MAX_PROJECTS);
  var wanted = Object.create(null), order = [], initiatives = 0;
  function want(entry) {
    if (wanted[entry.key]) return false;
    wanted[entry.key] = entry;
    order.push(entry.key);
    return true;
  }
  kept.forEach(function (p) {
    want({key: "project:" + p.id, tool: "list_issues", input: {project: p.id, limit: 100}});
  });
  kept.forEach(function (p) {
    (Array.isArray(p.initiatives) ? p.initiatives : []).forEach(function (ref) {
      if (initiatives < OPS_MAX_INITIATIVES && ref && opsStr(ref.id)
          && want({key: "initiative:" + ref.id, tool: "get_initiative", input: {query: ref.id}})) initiatives += 1;
    });
  });
  have = Array.isArray(have) ? have : [];
  var held = Object.create(null);
  have.forEach(function (key) { held[key] = true; });
  return {
    drop: have.filter(function (key) { return !wanted[key]; }),
    add: order.filter(function (key) { return !held[key]; }).map(function (key) { return wanted[key]; })
  };
}

function opsModel(input) {
  input = input || {};
  var now = opsTime(input.now);
  if (now === null) now = Date.now();
  var linear = input.linear || null;
  var index = Object.create(null), issues = [];
  function lanes(projects) {
    return (projects || []).map(function (p) {
      return {id: p.id, name: p.name, url: p.url, nodes: (p.issues || []).map(function (i) {
        var node = {ticket: i.id, title: i.title, state: i.state, url: i.url, items: []};
        if (!index[i.id]) index[i.id] = node;
        issues.push(i);
        return node;
      })};
    });
  }
  var zones = linear ? (linear.initiatives || []).map(function (z) {
    return {id: z.id, name: z.name, url: z.url, parent: z.parent, lanes: lanes(z.projects)};
  }) : [];
  var noInitiative = linear ? lanes(linear.noInitiative) : [];
  var outside = linear ? lanes(linear.outside) : [];

  function docs(name) {
    return (Array.isArray(input[name]) ? input[name] : []).filter(function (d) { return d && typeof d === "object"; });
  }
  function recent(d, ms) {
    var t = opsTime(d.last_at);
    return t !== null && now - t <= ms;
  }
  var builds = docs("builds").map(function (d) { return {kind: "build", id: d.wf, doc: d}; });
  var sessions = docs("sessions").filter(function (d) { return recent(d, OPS_DAY_MS); })
    .map(function (d) { return {kind: "session", id: d.tag || "repo:" + d.repo, doc: d}; });
  var waits = docs("waits").filter(function (d) { return d.state === "open"; })
    .map(function (d) { return {kind: "wait", id: d.tag ? d.ref + " " + d.tag : d.ref, doc: d}; });
  var sweep = docs("sweep").filter(function (d) { return d.present === true; })
    .map(function (d) { return {kind: "sweep", id: d.key, doc: d}; });

  var other = [], otherOf = Object.create(null), unlinked = [];
  builds.concat(sessions, waits, sweep).forEach(function (item) {
    var ticket = opsStr(item.doc.ticket);
    if (!ticket) {
      unlinked.push(item);
    } else if (index[ticket]) {
      index[ticket].items.push(item);
    } else {
      if (!otherOf[ticket]) {
        otherOf[ticket] = {ticket: ticket, items: []};
        other.push(otherOf[ticket]);
      }
      otherOf[ticket].items.push(item);
    }
  });

  function newest(a, b) { return (opsTime(b.at) || 0) - (opsTime(a.at) || 0); }
  var moves = [];
  sessions.forEach(function (s) {
    (Array.isArray(s.doc.moves) ? s.doc.moves : []).forEach(function (m) {
      if (m && typeof m === "object") moves.push({text: m.text, at: m.at, session: s.id});
    });
  });
  var floor = {
    builds: builds.filter(function (b) { return b.doc.status === "running" || b.doc.status === "waiting"; }),
    sessions: sessions.filter(function (s) { return recent(s.doc, OPS_FLOOR_MS); }),
    moves: moves.sort(newest).slice(0, 10)
  };

  var waitsList = waits.concat(sweep).sort(function (a, b) {
    return newest({at: a.doc.updated_at}, {at: b.doc.updated_at});
  });

  var edges = [], edgeSeen = Object.create(null);
  function edge(from, to, kind, key) {
    if (edgeSeen[key]) return;
    edgeSeen[key] = true;
    edges.push({from: from, to: to, kind: kind});
  }
  issues.forEach(function (i) {
    if (i.parent && index[i.parent]) edge(i.parent, i.id, "parent", i.parent + " " + i.id);
  });
  sessions.forEach(function (s) {
    var on = [];
    (Array.isArray(s.doc.tickets) ? s.doc.tickets : []).forEach(function (t) {
      if (opsStr(t) && index[t] && on.indexOf(t) < 0) on.push(t);
    });
    for (var a = 0; a < on.length; a += 1) {
      for (var b = a + 1; b < on.length; b += 1) edge(on[a], on[b], "session", [on[a], on[b]].sort().join(" "));
    }
  });

  var lastChange = null;
  ["builds", "sessions", "waits", "sweep"].forEach(function (name) {
    docs(name).forEach(function (d) {
      var t = opsTime(d.updated_at);
      if (t !== null && (lastChange === null || t > opsTime(lastChange))) lastChange = d.updated_at;
    });
  });

  return {zones: zones, noInitiative: noInitiative, outside: outside, other: other, unlinked: unlinked,
          floor: floor, waitsList: waitsList, edges: edges, lastChange: lastChange};
}
